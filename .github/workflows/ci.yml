name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The Commons service's database tests run against a real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
          POSTGRES_DB: commons_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TM_COMMONS_TEST_DATABASE: postgres://tm:tm@localhost:5432/commons_test
    steps:
      - uses: actions/checkout@v4
      # The version the code is written against, so a new lint does not fail an old commit.
      - run: rustup toolchain install 1.93.1 --profile minimal --component clippy && rustup default 1.93.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash deploy/commons/lib/test-load-env.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # macOS and Windows checkouts are case-insensitive: two paths that differ only by
      # case collapse into one there and break the desktop build.
      - run: scripts/check-case.sh
      # Cargo.toml, the desktop crate, tauri.conf.json and the web app say one version.
      - run: scripts/version.sh check
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cd ../site && npm ci && npm test && node build.mjs --offline

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # The e2e setup needs the daemon binary and the built app.
      - run: cargo build -p tm-daemon --locked --bins --example ui_fixture
      - run: cd web && npm run build
      # The site's landing page loads Lenis and GSAP from its own node_modules.
      - run: cd site && npm ci
      # The runner's own Chrome; Playwright downloads no browser.
      - run: cd web && TASKMASTER_CHROME=$(command -v google-chrome) npm run e2e

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Icons and a stand-in sidecar
        run: |
          npx --yes @tauri-apps/cli@2 icon assets/icon.png -o desktop/src-tauri/icons
          touch "desktop/src-tauri/binaries/tm-daemon-$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - run: cd desktop/src-tauri && cargo check --locked
