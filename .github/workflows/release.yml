name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - run: cargo build --release --locked -p tm-daemon -p tm-review
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd web && npm ci && npm run build
      - name: Package
        run: |
          name="taskmaster-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/tm-daemon target/release/tm-review README.md config.example.json "$name/"
          # Serve it with `tm-daemon serve <project> --web web`, or copy it to ~/.local/share/taskmaster/web.
          cp -R web/dist "$name/web"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" taskmaster-*.tar.gz taskmaster-*.sha256 --generate-notes
