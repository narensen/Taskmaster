[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop shell needs the system webview to build; CI builds it on its own.
exclude = ["desktop"]

[workspace.package]
edition = "2024"
version = "0.1.8"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
anyhow = "1"
async-trait = "0.1"
