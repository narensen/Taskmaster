[package]
name = "tm-flow"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["python", "typescript", "rust"]
python = ["dep:tree-sitter", "dep:tree-sitter-python"]
typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[dependencies]
tm-core = { path = "../tm-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
globset = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
sha1 = "0.11"
sha2 = "0.10"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
