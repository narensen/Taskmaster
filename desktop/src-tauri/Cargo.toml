[package]
name = "taskmaster-desktop"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Taskmaster for the desktop: the app and tm-daemon in one window."

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tm-launcher = { path = "../../crates/tm-launcher" }

[profile.release]
codegen-units = 1
lto = true
strip = true
